name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python_service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: python_service/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  node:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: node_service } }
    env: { PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: node_service/package-lock.json }
      - run: npm ci
      - run: npm test
