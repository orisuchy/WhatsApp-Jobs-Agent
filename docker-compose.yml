services:
  python-backend:
    build: ./python_service
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  node-whatsapp:
    build: ./node_service
    env_file: .env
    depends_on:
      - python-backend
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    restart: unless-stopped

volumes:
  whatsapp_session:
